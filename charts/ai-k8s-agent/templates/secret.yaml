{{- $name := include "agent.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingData := ($existing).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.llm.existingSecret }}
  llm-api-key: {{ .Values.llm.apiKey | b64enc | quote }}
  {{- end }}
  {{- if not .Values.auth.existingSecret }}
  {{- /* keep the generated password and signing key stable across upgrades */}}
  admin-password: {{ if .Values.auth.adminPassword }}{{ .Values.auth.adminPassword | b64enc | quote }}{{ else }}{{ index $existingData "admin-password" | default (randAlphaNum 20 | b64enc) | quote }}{{ end }}
  secret-key: {{ index $existingData "secret-key" | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
