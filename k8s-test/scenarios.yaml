# Intentionally broken workloads for testing the AI Kubernetes Agent.
# Everything lives in the k8s-agent-test namespace. Remove with ./k8s-test/cleanup.sh
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-agent-test
---
# Scenario 1: CrashLoopBackOff - required env var DATABASE_URL is missing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: k8s-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", 'if [ -z "$DATABASE_URL" ]; then echo "FATAL: DATABASE_URL environment variable is not set"; exit 1; fi; sleep 3600']
---
# Scenario 2: ImagePullBackOff - image tag does not exist
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: k8s-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: web-frontend }
  template:
    metadata:
      labels: { app: web-frontend }
    spec:
      containers:
        - name: web
          image: nginx:1.99.99-does-not-exist
---
# Scenario 3: OOMKilled - allocates ~100MB with a 20Mi memory limit
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: k8s-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: memory-hog }
  template:
    metadata:
      labels: { app: memory-hog }
    spec:
      containers:
        - name: hog
          image: busybox:1.36
          command: ["sh", "-c", "dd if=/dev/zero bs=1M count=100 | tail; sleep 3600"]
          resources:
            requests: { memory: 10Mi }
            limits: { memory: 20Mi }
---
# Scenario 4: Service selector mismatch - pods are healthy but labelled app=api,
# the Service selects app=api-server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: k8s-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: k8s-agent-test
spec:
  selector:
    app: api-server
  ports:
    - port: 80
      targetPort: 8080
---
# Scenario 5: PVC Pending - StorageClass does not exist
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-volume
  namespace: k8s-agent-test
spec:
  storageClassName: fast-ssd-does-not-exist
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
# Scenario 6: missing ConfigMap - pod references app-config which does not exist
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-reader
  namespace: k8s-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-reader }
  template:
    metadata:
      labels: { app: config-reader }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef: { name: app-config }
---
# Scenario 7: failing Job - exits 1 every time
apiVersion: batch/v1
kind: Job
metadata:
  name: nightly-report
  namespace: k8s-agent-test
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.36
          command: ["sh", "-c", "echo 'ERROR: cannot connect to reports-db:5432'; exit 1"]
---
# Scenario 8: Ingress points to a Service that does not exist
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: k8s-agent-test
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: shop-frontend, port: { number: 80 } }
