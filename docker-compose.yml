# Local development: uses your own kubeconfig. For clusters, install the Helm chart (charts/ai-k8s-agent).
services:
  backend:
    build: ./backend
    # local dev only: root so the container can read your kubeconfig (usually mode 600)
    user: "0"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      KUBECONFIG_PATH: /kube/config
      DATA_DIR: /data
    volumes:
      - ${KUBECONFIG_HOST_PATH:-~/.kube/config}:/kube/config:ro
      - agent-data:/data

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:9000
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  agent-data:
