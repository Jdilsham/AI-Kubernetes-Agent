name: Release

# Push a tag like v0.3.0 to publish:
#   ghcr.io/<owner>/ai-k8s-agent-backend:<version>, ghcr.io/<owner>/ai-k8s-agent-frontend:<version>
#   oci://ghcr.io/<owner>/charts/ai-k8s-agent --version <version>
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # GitHub Release
  packages: write   # GHCR images and chart

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner (GHCR requires it)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/ai-k8s-agent-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  chart:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Set chart version from the tag
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/^version: .*/version: $VERSION/; s/^appVersion: .*/appVersion: \"$VERSION\"/" charts/ai-k8s-agent/Chart.yaml
      - name: Package and push the chart (OCI)
        run: |
          helm package charts/ai-k8s-agent
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "ai-k8s-agent-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          \`\`\`bash
          helm install k8s-agent oci://ghcr.io/${OWNER}/charts/ai-k8s-agent --version ${VERSION} \\
            -n k8s-agent --create-namespace --set llm.apiKey=\$LLM_API_KEY --set llm.model=<model>
          \`\`\`

          Images: \`ghcr.io/${OWNER}/ai-k8s-agent-backend:${VERSION}\`, \`ghcr.io/${OWNER}/ai-k8s-agent-frontend:${VERSION}\`
          NOTES
          gh release create "$GITHUB_REF_NAME" "ai-k8s-agent-${VERSION}.tgz" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
